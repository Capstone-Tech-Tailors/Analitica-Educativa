version: '3.8'
services:
    devcontainer:
        build:
            context: ..
            dockerfile: Dockerfile
        depends_on:
            - db
        volumes:
            - ../..:/workspaces:cached
        env_file:
            - db.env
        network_mode: service:db
        command: sleep infinity
    db:
        image: postgres:latest
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql/data
        env_file:
            - db.env
volumes:
    postgres-data:
